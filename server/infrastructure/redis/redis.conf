bind 0.0.0.0
# Host exposure is restricted to 127.0.0.1 by Docker Compose. Disabling Redis
# protected mode also allows application containers on the private Compose network.
protected-mode no
port 6379

dir /data
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000

appendonly yes
appenddirname appendonlydir
appendfsync everysec
aof-use-rdb-preamble yes

maxmemory-policy noeviction
